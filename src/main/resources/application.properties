spring.application.name=autoloc

# ===================================================================
# Configuration de la source de donnees MySQL
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Configuration JPA / Hibernate
# Mode 'update' : met a jour le schema sans perte de donnees (choix AutoLoc)
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Journalisation (Logs applicatifs)
# ===================================================================
logging.level.root=INFO
logging.level.tn.esprit.autoloc=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
